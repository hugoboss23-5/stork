[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stork"
version = "0.1.0"
description = "Stork — The Campaign Engine. Sustained, multi-night efforts that compound."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "mcp[cli]>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
